<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1877F2">
  <title>ادھار کھاتہ | Ktk Store</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>

<!-- ============ LOGIN SCREEN ============ -->
<div id="loginScreen" class="login-screen">
  <div class="login-header">
    <div class="logo-circle">
      <svg viewBox="0 0 24 24" fill="white" width="42" height="42">
        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke="white" stroke-width="2" fill="none" stroke-linejoin="round"/>
      </svg>
    </div>
    <h1>ادھار کھاتہ</h1>
    <p>اپنی دکان کا حساب کتاب آسانی سے رکھیں</p>
  </div>

  <div class="login-card">
    <div class="login-tabs">
      <button class="login-tab active" id="tabLogin">لاگ ان</button>
      <button class="login-tab" id="tabSignup">نیا اکاؤنٹ</button>
    </div>

    <div class="input-group">
      <span class="input-icon">📧</span>
      <input type="email" id="loginEmail" placeholder="ای میل لکھیں" autocomplete="email">
    </div>

    <div class="input-group">
      <span class="input-icon">🔒</span>
      <input type="password" id="loginPassword" placeholder="پاسورڈ لکھیں" autocomplete="current-password">
    </div>

    <p id="loginError" class="error-msg"></p>

    <button id="loginBtn" class="btn-primary">لاگ ان کریں</button>
    <button id="signupBtn" class="btn-primary" style="display:none;">نیا اکاؤنٹ بنائیں</button>

    <p class="login-footer">© 2026 Ktk Store — تمام حقوق محفوظ ہیں</p>
  </div>
</div>

<!-- ============ MAIN APP ============ -->
<div id="mainApp" class="main-app" style="display:none;">

  <!-- Top Bar -->
  <header class="app-header">
    <div class="header-left">
      <div class="header-avatar">K</div>
      <div>
        <div class="header-title">ادھار کھاتہ</div>
        <div class="header-sub" id="userEmail">—</div>
      </div>
    </div>
    <button id="logoutBtn" class="logout-btn" title="لاگ آؤٹ">⏻</button>
  </header>

  <!-- Dashboard Stats -->
  <section class="stats-row">
    <div class="stat-card">
      <div class="stat-value" id="totalCustomers">0</div>
      <div class="stat-label">کل کسٹمرز</div>
    </div>
    <div class="stat-card accent">
      <div class="stat-value" id="totalOutstanding">₨ 0</div>
      <div class="stat-label">کل بقایا</div>
    </div>
  </section>

  <!-- Bill Form -->
  <section class="card">
    <div class="card-header">
      <h2>نیا بل بنائیں</h2>
    </div>

    <div class="input-group">
      <span class="input-icon">👤</span>
      <input type="text" id="customerName" placeholder="کسٹمر کا نام" list="customerNames" autocomplete="off">
      <datalist id="customerNames"></datalist>
    </div>

    <div class="input-group">
      <span class="input-icon">📱</span>
      <input type="tel" id="customerPhone" placeholder="واٹس ایپ نمبر (923001234567)">
    </div>

    <div class="balance-card">
      <div class="balance-label">پچھلا بقایا</div>
      <div class="balance-value">₨ <span id="previousBalance">0</span></div>
    </div>

    <div class="section-title">
      <span>آئٹمز</span>
      <button type="button" id="addItemBtn" class="btn-mini">+ آئٹم شامل کریں</button>
    </div>
    <div id="itemsContainer"></div>

    <div class="input-group">
      <span class="input-icon">💵</span>
      <input type="number" id="paymentAmount" placeholder="ادائیگی (اگر کی ہو)" value="0">
    </div>

    <button id="generateBillBtn" class="btn-primary">بل بنائیں</button>
  </section>

  <!-- Bill Preview -->
  <section id="billPreviewWrapper" class="card" style="display:none;">
    <div id="billPreview"></div>
    <div class="action-row">
      <button id="shareWhatsappBtn" class="btn-whatsapp">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="white">
          <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/>
        </svg>
        واٹس ایپ پر بھیجیں
      </button>
      <button id="newBillBtn" class="btn-secondary">نیا بل</button>
    </div>
  </section>

</div>

<script type="module" src="app.js"></script>
</body>
</html>
